<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prasa Workflow</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <h2>Prasa Workflow</h2>
        </div>

        <nav class="menu">

            <button class="menu-btn active" data-page="dashboard">
                Dashboard
            </button>

            <button class="menu-btn" data-page="clients">
                Client
            </button>

            <button class="menu-btn" data-page="projects">
                Project
            </button>

            <button class="menu-btn" data-page="workflow">
                Workflow
            </button>

            <button class="menu-btn" data-page="tasks">
                Task
            </button>

            <button class="menu-btn" data-page="calendar">
                Kalender
            </button>

            <button class="menu-btn" data-page="reports">
                Laporan
            </button>

        </nav>

    </aside>

    <main class="content">

        <header class="header">

            <h1 id="page-title">
                Dashboard
            </h1>

        </header>

        <!-- DASHBOARD -->

        <section id="dashboard-page" class="page">

            <div class="stats">

                <div class="stat-card">
                    <h3 id="total-clients">0</h3>
                    <p>Client</p>
                </div>

                <div class="stat-card">
                    <h3 id="total-projects">0</h3>
                    <p>Project</p>
                </div>

                <div class="stat-card">
                    <h3 id="active-projects">0</h3>
                    <p>Aktif</p>
                </div>

                <div class="stat-card">
                    <h3 id="finished-projects">0</h3>
                    <p>Selesai</p>
                </div>

            </div>

        </section>

        <!-- CLIENT -->

        <section id="clients-page" class="page hidden">

            <div class="toolbar">

                <button id="add-client-btn">
                    + Client Baru
                </button>

                <input
                    id="client-search"
                    placeholder="Cari client..."
                >

            </div>

            <form id="client-form" class="hidden">

                <input id="client-name" placeholder="Nama" required>

                <input id="client-phone" placeholder="WhatsApp">

                <input id="client-email" placeholder="Email">

                <input id="client-instagram" placeholder="Instagram">

                <input id="client-address" placeholder="Alamat">

                <textarea
                    id="client-notes"
                    placeholder="Catatan"
                ></textarea>

                <div class="form-buttons">

                    <button type="submit">
                        Simpan
                    </button>

                    <button
                        type="button"
                        id="cancel-client-btn"
                    >
                        Batal
                    </button>

                </div>

            </form>

            <div id="client-list"></div>

        </section>

        <!-- PROJECT -->

        <section id="projects-page" class="page hidden">

            <div class="toolbar">

                <button id="add-project-btn">
                    + Project Baru
                </button>

                <input
                    id="project-search"
                    placeholder="Cari project..."
                >

            </div>

            <form id="project-form" class="hidden">

                <select
                    id="project-client"
                    required
                ></select>

                <input
                    id="project-title"
                    placeholder="Nama project"
                    required
                >

                <input
                    id="project-date"
                    type="date"
                >

                <input
                    id="project-location"
                    placeholder="Lokasi"
                >

                <select id="project-package">

                    <option value="">
                        Pilih Paket
                    </option>

                    <option>
                        Gold
                    </option>

                    <option>
                        Platinum
                    </option>

                </select>

                <input
                    id="project-photographer"
                    placeholder="Fotografer"
                >

                <input
                    id="project-editor"
                    placeholder="Editor"
                >

                <div class="form-buttons">

                    <button type="submit">
                        Simpan
                    </button>

                    <button
                        type="button"
                        id="cancel-project-btn"
                    >
                        Batal
                    </button>

                </div>

            </form>

            <div id="project-list"></div>

        </section>

        <!-- WORKFLOW -->

        <section id="workflow-page" class="page hidden">

            <select id="workflow-project-select">

                <option value="">
                    Pilih Project
                </option>

            </select>

            <div id="workflow-board"></div>

        </section>

        <!-- TASK -->

        <section id="tasks-page" class="page hidden">

            <div id="task-list"></div>

        </section>

        <!-- CALENDAR -->

        <section id="calendar-page" class="page hidden">

            <div id="calendar-nav" class="toolbar" style="justify-content:center; align-items:center; gap:15px; flex-wrap:wrap;">
                <button id="cal-view-toggle" type="button" style="width:auto; background:var(--primary); color:white;">Tampilan: Tahunan</button>

                <div id="cal-nav-year" style="display:flex; align-items:center; gap:15px;">
                    <button id="cal-prev" type="button" style="width:auto;">‹</button>
                    <h2 id="cal-year" style="margin:0;"></h2>
                    <button id="cal-next" type="button" style="width:auto;">›</button>
                </div>

                <div id="cal-nav-month" class="hidden" style="display:flex; align-items:center; gap:15px;">
                    <button id="cal-month-prev" type="button" style="width:auto;">‹</button>
                    <h2 id="cal-month-label" style="margin:0;"></h2>
                    <button id="cal-month-next" type="button" style="width:auto;">›</button>
                </div>
            </div>

            <div id="calendar-list"></div>

        </section>

        <!-- REPORT -->

        <section id="reports-page" class="page hidden">

            <div id="report-list"></div>

        </section>

    </main>

</div>

<div id="toast"></div>

<script src="app.js"></script>

</body>
</html>
